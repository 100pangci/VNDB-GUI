name: Build and Release

on:
  push:
  pull_request:

permissions:
  contents: write

# ==================== 修改区 ====================
env:
  VNDB_GUI_VERSION: ${{ github.ref_name }}
  # 强制让 GitHub Actions 使用 Node.js 24 引擎运行插件，消除老版本弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
# ================================================

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install customtkinter requests

      - name: 运行测试
        run: pytest tests/ -v --tb=short

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter requests

      - name: 运行 Windows 打包脚本
        shell: cmd
        run: |
          call build_gui_exe.bat

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: VNDB-GUI-Windows-${{ github.ref_name }}
          path: release/VNDB-GUI-${{ github.ref_name }}.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter requests

      - name: 运行 Linux 打包脚本
        run: |
          chmod +x build_gui_linux.sh
          ./build_gui_linux.sh

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: VNDB-GUI-Linux-${{ github.ref_name }}
          path: release/VNDB-GUI-${{ github.ref_name }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/VNDB-GUI-Windows-${{ github.ref_name }}/VNDB-GUI-${{ github.ref_name }}.exe
            artifacts/VNDB-GUI-Linux-${{ github.ref_name }}/VNDB-GUI-${{ github.ref_name }}
          generate_release_notes: true